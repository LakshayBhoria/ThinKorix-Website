<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="appbar" class="appbar"></div>

<main>
<div class="page wrap">
  <div class="page-head">
    <div>
      <div class="eyebrow">Verification</div>
      <h1>Certificate Verification</h1>
      <p>Look up any Thinkorix certificate by ID and get an instant verified / invalid result.</p>
    </div>
  </div>

  <div class="card" style="max-width:560px;margin-bottom:24px;">
    <form id="verify-form">
      <div class="field">
        <label for="cert-id">Certificate ID</label>
        <input id="cert-id" placeholder="e.g. THX-INTERN-2026-3011" required>
        <p class="hint">Found on the certificate PDF, or scan its QR code — it links straight here.</p>
      </div>
      <button class="btn btn-primary" type="submit">Verify</button>
    </form>
  </div>

  <div id="result"></div>

  <div class="card" id="admin-search-card" style="display:none;max-width:560px;margin-top:26px;">
    <h3 style="font-size:15px;margin-bottom:12px;">Admin lookup — search by name or email</h3>
    <div style="display:flex;gap:10px;">
      <input id="admin-q" placeholder="Name or email…">
      <button class="btn btn-ghost" id="admin-q-btn">Search</button>
    </div>
    <div id="admin-results" style="margin-top:14px;"></div>
  </div>
</div>
</main>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
if (THX.requireLogin()) {
  THX.renderAppbar({ title: 'Certificate Verification' });
  const user = THX.getUser();
  const result = document.getElementById('result');

  async function runVerify(certId) {
    result.innerHTML = `<div class="loading-block"><div class="spinner"></div> Checking…</div>`;
    try {
      const data = await THX.api('/api/verify/' + encodeURIComponent(certId));
      if (!data.valid) {
        result.innerHTML = `<div class="card" style="border-color:rgba(255,92,92,.4);max-width:560px;">
          <span class="tag tag-red">Invalid</span>
          <p style="margin-top:10px;color:var(--slate);">${data.revoked ? 'This certificate has been revoked.' : 'No certificate found with that ID.'}</p>
        </div>`;
        return;
      }
      result.innerHTML = `<div class="card" style="border-color:rgba(18,212,104,.4);max-width:560px;">
        <span class="tag tag-green">Verified</span>
        <h3 style="margin-top:12px;font-size:17px;">${THX.escapeHtml(data.name)}</h3>
        <p style="color:var(--slate);font-size:13.5px;margin-top:4px;">${THX.escapeHtml(data.position)} — ${THX.escapeHtml(data.department)}</p>
        <div class="grid grid-2" style="margin-top:16px;">
          <div><div class="hint">Intern No.</div><div>${data.internNo}</div></div>
          <div><div class="hint">Certificate ID</div><div>${THX.escapeHtml(data.certificateId)}</div></div>
          <div><div class="hint">Start</div><div>${THX.fmtDate(data.startDate)}</div></div>
          <div><div class="hint">End</div><div>${THX.fmtDate(data.endDate)}</div></div>
        </div>
      </div>`;
    } catch (ex) {
      result.innerHTML = `<div class="alert alert-error show">${ex.message}</div>`;
    }
  }

  document.getElementById('verify-form').addEventListener('submit', (e) => {
    e.preventDefault();
    runVerify(document.getElementById('cert-id').value.trim());
  });

  // Deep-link support: verify.html?certId=... (matches QR codes generated by the backend)
  const q = new URLSearchParams(location.search).get('certId');
  if (q) { document.getElementById('cert-id').value = q; runVerify(q); }

  if (user.role === 'admin') {
    document.getElementById('admin-search-card').style.display = 'block';
    async function runAdminSearch() {
      const q = document.getElementById('admin-q').value.trim();
      const box = document.getElementById('admin-results');
      if (!q) return;
      box.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
      try {
        const data = await THX.api('/api/verify', { query: { q } });
        box.innerHTML = data.results.length ? `<div class="row-list">${data.results.map(r => `
          <div class="row-item"><div class="main"><h4>${THX.escapeHtml(r.fullName)}</h4><div class="meta">${THX.escapeHtml(r.email)} · ${THX.escapeHtml(r.certificateId)}</div></div>
          <button class="btn btn-sm btn-ghost" data-cert="${r.certificateId}">View</button></div>`).join('')}</div>`
          : `<p style="color:var(--slate);font-size:13px;">No matches.</p>`;
        box.querySelectorAll('[data-cert]').forEach(b => b.addEventListener('click', () => {
          document.getElementById('cert-id').value = b.dataset.cert;
          runVerify(b.dataset.cert);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }));
      } catch (ex) { box.innerHTML = `<div class="alert alert-error show">${ex.message}</div>`; }
    }
    document.getElementById('admin-q-btn').addEventListener('click', runAdminSearch);
    document.getElementById('admin-q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runAdminSearch(); } });
  }
}
</script>
</body>
</html>
