<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="appbar" class="appbar"></div>

<main>
<div class="page wrap" id="page-root">
  <div class="loading-block"><div class="spinner"></div></div>
</div>
</main>

<div class="modal-backdrop" id="detail-backdrop">
  <div class="modal" id="detail-modal" style="max-width:600px;"></div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
if (THX.requireLogin({ roles: ['client', 'admin'] })) {
  THX.renderAppbar({ title: 'Client Portal' });
  const user = THX.getUser();
  const isAdmin = user.role === 'admin';
  const root = document.getElementById('page-root');
  const STATUS_TAG = { submitted: 'tag-amber', 'in-progress': 'tag-amber', done: 'tag-green', pending: 'tag-slate' };

  root.innerHTML = `
    <div class="page-head">
      <div>
        <div class="eyebrow">Delivery</div>
        <h1>Client Portal</h1>
        <p>Submit requirements, upload files, track milestones, and download deliverables — all in one place.</p>
      </div>
      ${!isAdmin ? `<button class="btn btn-primary" id="new-project-btn">+ New project</button>` : ''}
    </div>
    <div id="list" class="row-list"><div class="loading-block"><div class="spinner"></div></div></div>
  `;

  async function loadList() {
    const list = document.getElementById('list');
    list.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
    try {
      const data = await THX.api('/api/client-projects');
      list.innerHTML = data.projects.length ? data.projects.map(p => `
        <div class="row-item">
          <div class="main"><h4>${THX.escapeHtml(p.title)}</h4><div class="meta">${p.milestones.length} milestone(s) · ${p.deliverables.length} deliverable(s)</div></div>
          <span class="tag ${STATUS_TAG[p.status] || 'tag-slate'}">${p.status}</span>
          <button class="btn btn-sm btn-ghost" data-open="${p.id}">Open</button>
        </div>`).join('') : `<div class="empty-state">No projects yet${isAdmin ? '.' : ' — start one with "New project".'}</div>`;
      list.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openDetail(b.dataset.open)));
    } catch (ex) { list.innerHTML = `<div class="alert alert-error show">${ex.message}</div>`; }
  }
  loadList();

  if (!isAdmin) {
    document.getElementById('new-project-btn').addEventListener('click', () => {
      document.getElementById('detail-modal').innerHTML = `
        <h3>New project</h3>
        <div class="alert alert-error" id="np-err"></div>
        <form id="np-form">
          <div class="field"><label>Title</label><input id="np-title" required></div>
          <div class="field"><label>Requirements</label><textarea id="np-req" required placeholder="Describe what you need built…"></textarea></div>
          <div class="field"><label>Files (optional, up to 10)</label><input id="np-files" type="file" multiple></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="np-cancel">Cancel</button>
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </form>`;
      document.getElementById('detail-backdrop').classList.add('open');
      document.getElementById('np-cancel').addEventListener('click', () => document.getElementById('detail-backdrop').classList.remove('open'));
      document.getElementById('np-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('np-err'); err.classList.remove('show');
        try {
          const fd = new FormData();
          fd.append('title', document.getElementById('np-title').value.trim());
          fd.append('requirements', document.getElementById('np-req').value.trim());
          for (const f of document.getElementById('np-files').files) fd.append('files', f);
          await THX.api('/api/client-projects', { method: 'POST', body: fd });
          document.getElementById('detail-backdrop').classList.remove('open');
          THX.toast('Project submitted');
          loadList();
        } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
      });
    });
  }

  async function openDetail(id) {
    const modal = document.getElementById('detail-modal');
    modal.innerHTML = `<div class="loading-block"><div class="spinner"></div></div>`;
    document.getElementById('detail-backdrop').classList.add('open');
    try {
      const { project: p } = await THX.api('/api/client-projects/' + id);
      modal.innerHTML = `
        <h3>${THX.escapeHtml(p.title)}</h3>
        <p style="font-size:13.5px;color:var(--slate);margin-bottom:16px;">${THX.escapeHtml(p.requirements)}</p>

        ${p.files.length ? `<div class="hint" style="margin-bottom:6px;">Submitted files</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">${p.files.map(f => `<a href="${f.url}" target="_blank" class="tag tag-slate">${THX.escapeHtml(f.originalName)}</a>`).join('')}</div>` : ''}

        <div class="hint" style="margin-bottom:6px;">Milestones</div>
        <div class="row-list" style="margin-bottom:14px;" id="milestone-list">
          ${p.milestones.map(m => `<div class="row-item"><div class="main"><h4 style="font-size:13.5px;">${THX.escapeHtml(m.title)}</h4>${m.dueDate ? `<div class="meta">Due ${THX.fmtDate(m.dueDate)}</div>` : ''}</div>
            ${isAdmin ? `<select data-ms="${m.id}" style="width:auto;padding:6px 8px;">
              <option value="pending" ${m.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="in-progress" ${m.status === 'in-progress' ? 'selected' : ''}>In progress</option>
              <option value="done" ${m.status === 'done' ? 'selected' : ''}>Done</option>
            </select>` : `<span class="tag ${STATUS_TAG[m.status]}">${m.status}</span>`}
          </div>`).join('') || '<p style="color:var(--slate);font-size:13px;">No milestones yet.</p>'}
        </div>
        ${isAdmin ? `<form id="ms-form" style="display:flex;gap:8px;margin-bottom:20px;">
          <input id="ms-title" placeholder="New milestone title" required style="flex:2;">
          <input id="ms-due" type="date" style="flex:1;">
          <button class="btn btn-sm btn-primary" type="submit">Add</button>
        </form>` : ''}

        <div class="hint" style="margin-bottom:6px;">Deliverables</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:${isAdmin ? '14px' : '4px'};" id="deliv-list">
          ${p.deliverables.length ? p.deliverables.map(d => `<a href="${d.url}" target="_blank" class="tag tag-green">${THX.escapeHtml(d.originalName)}</a>`).join('') : '<p style="color:var(--slate);font-size:13px;">Nothing delivered yet.</p>'}
        </div>
        ${isAdmin ? `<form id="dl-form" style="display:flex;gap:8px;">
          <input id="dl-files" type="file" multiple style="flex:1;">
          <button class="btn btn-sm btn-primary" type="submit">Upload</button>
        </form>` : ''}

        <div class="modal-actions"><button class="btn btn-ghost" id="detail-close">Close</button></div>
      `;
      document.getElementById('detail-close').addEventListener('click', () => document.getElementById('detail-backdrop').classList.remove('open'));

      if (isAdmin) {
        modal.querySelectorAll('[data-ms]').forEach(sel => sel.addEventListener('change', async (e) => {
          try { await THX.api(`/api/client-projects/${id}/milestones/${e.target.dataset.ms}`, { method: 'PATCH', body: { status: e.target.value } }); THX.toast('Milestone updated'); loadList(); }
          catch (ex) { THX.toast(ex.message, true); }
        }));
        document.getElementById('ms-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await THX.api(`/api/client-projects/${id}/milestones`, { method: 'POST', body: { title: document.getElementById('ms-title').value.trim(), dueDate: document.getElementById('ms-due').value || null } });
            THX.toast('Milestone added'); openDetail(id);
          } catch (ex) { THX.toast(ex.message, true); }
        });
        document.getElementById('dl-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const fd = new FormData();
            for (const f of document.getElementById('dl-files').files) fd.append('files', f);
            await THX.api(`/api/client-projects/${id}/deliverables`, { method: 'POST', body: fd });
            THX.toast('Uploaded'); openDetail(id);
          } catch (ex) { THX.toast(ex.message, true); }
        });
      }
    } catch (ex) { modal.innerHTML = `<div class="alert alert-error show">${ex.message}</div><div class="modal-actions"><button class="btn btn-ghost" onclick="document.getElementById('detail-backdrop').classList.remove('open')">Close</button></div>`; }
  }
}
</script>
</body>
</html>
