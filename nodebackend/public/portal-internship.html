<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Portal — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="appbar" class="appbar"></div>

<main>
<div class="page wrap" id="page-root">
  <div class="loading-block"><div class="spinner"></div> Loading…</div>
</div>
</main>

<div class="modal-backdrop" id="task-modal-backdrop">
  <div class="modal">
    <h3>Add task</h3>
    <div class="alert alert-error" id="task-m-err"></div>
    <form id="task-m-form">
      <input type="hidden" id="task-m-intern">
      <div class="field"><label>Title</label><input id="task-m-title" required></div>
      <div class="field"><label>Description (optional)</label><textarea id="task-m-desc"></textarea></div>
      <div class="field"><label>Due date (optional)</label><input id="task-m-due" type="date"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="task-m-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Add task</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="group-modal-backdrop">
  <div class="modal">
    <h3 id="group-m-heading">Create group</h3>
    <div class="alert alert-error" id="group-m-err"></div>
    <form id="group-m-form">
      <input type="hidden" id="group-m-id">
      <div class="field"><label>Group name</label><input id="group-m-name" required></div>
      <div class="field"><label>Description (optional)</label><textarea id="group-m-desc"></textarea></div>
      <div class="field"><label>Members</label>
        <div id="group-m-members" style="max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:10px;"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="group-m-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save group</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
if (THX.requireLogin()) {
  THX.renderAppbar({ title: 'Internship Portal' });
  const user = THX.getUser();
  const root = document.getElementById('page-root');

  const POSITIONS = ['Mechanical Head (Onsite)', 'Software Engineering Intern', 'AI & ML Intern', 'Web & Mobile Development Intern', 'Hardware Intern', 'Cloud & DevOps Intern'];
  const DEPARTMENTS = ['Mechanical Department', 'Software Department', 'AI & ML Department', 'Web & Mobile Department', 'Hardware Department', 'Cloud & DevOps Department'];
  const DURATIONS = ['1 month', '2 months', '3 months', '6 months'];

  function opts(list) { return list.map(v => `<option value="${v}">${v}</option>`).join(''); }

  function shell(tabsHtml, panelsHtml) {
    root.innerHTML = `
      <div class="page-head">
        <div>
          <div class="eyebrow">Internships</div>
          <h1>Internship Portal</h1>
          <p>Applications, mentor assignment, tasks, reports, attendance, and the leaderboard — all in one place.</p>
        </div>
      </div>
      <div class="tabs" id="tabs">${tabsHtml}</div>
      ${panelsHtml}
    `;
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-' + t.dataset.tab).classList.add('active');
    }));
  }

  /* ---------------- Apply tab ---------------- */
  const GOOGLE_FORM_URL = 'https://forms.gle/xvPQkwmamwiH2QnJ8';
  function applyPanelHtml() {
    return `
      <div class="tab-panel" id="panel-apply">
        <div class="card" style="max-width:640px;">
          <h3 style="font-size:17px;margin-bottom:8px;">Apply for an internship</h3>
          <p style="color:var(--slate);font-size:14px;margin-bottom:18px;">
            Applications are handled through our internship registration form. Fill it out and
            your offer letter will be generated and emailed to you automatically.
          </p>
          <a class="btn btn-primary btn-block" href="${GOOGLE_FORM_URL}" target="_blank" rel="noopener">Open application form</a>
        </div>
      </div>`;
  }
  function wireApply() { /* apply tab now links out to the Google Form; nothing to wire */ }

  /* ---------------- My Program tab (intern) ---------------- */
  async function myProgramPanelHtml() {
    let data;
    try { data = await THX.api('/api/interns'); } catch { data = { interns: [] }; }
    const mine = (data.interns || [])[0];
    if (!mine) {
      return `<div class="tab-panel" id="panel-mine">
        <div class="empty-state">
          <p>No internship application on file for ${THX.escapeHtml(user.email)} yet.</p>
          <p style="margin-top:10px;"><a class="btn btn-primary btn-sm" href="#" onclick="document.querySelector('[data-tab=apply]').click();return false;">Apply now</a></p>
        </div>
      </div>`;
    }
    return `<div class="tab-panel" id="panel-mine">
      <div class="card" style="margin-bottom:18px;">
        <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;">
          <div>
            <h3 style="font-size:17px;margin-bottom:4px;">${THX.escapeHtml(mine.fullName)} · Intern No. ${mine.internNo}</h3>
            <div class="meta" style="color:var(--slate);font-size:13px;">${THX.escapeHtml(mine.position)} — ${THX.escapeHtml(mine.department)}</div>
          </div>
          <span class="tag ${mine.status === 'Active' ? 'tag-green' : 'tag-red'}">${mine.status}</span>
        </div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
          ${mine.offerLetterUrl || mine.offerLetterFile
            ? `<a class="btn btn-ghost btn-sm" href="${mine.offerLetterUrl || `${THX.API_BASE}/storage/offers/${mine.offerLetterFile}`}" target="_blank">Offer letter</a>`
            : `<span class="btn btn-ghost btn-sm" style="opacity:.5;cursor:default;" title="Ask an admin to resend your documents">Offer letter unavailable</span>`}
          ${mine.certificateUrl || mine.certificateFile
            ? `<a class="btn btn-ghost btn-sm" href="${mine.certificateUrl || `${THX.API_BASE}/storage/certificates/${mine.certificateFile}`}" target="_blank">Certificate</a>`
            : `<span class="btn btn-ghost btn-sm" style="opacity:.5;cursor:default;" title="Ask an admin to resend your documents">Certificate unavailable</span>`}
        </div>
      </div>
      <div class="grid grid-2" id="mine-grid" data-intern-no="${mine.internNo}">
        <div class="card"><h4 style="margin-bottom:12px;">Tasks</h4><div id="mine-tasks" class="loading-block"><div class="spinner"></div></div></div>
        <div class="card">
          <h4 style="margin-bottom:12px;">Reports</h4>
          <form id="report-form" style="margin-bottom:14px;">
            <div class="field-row">
              <div class="field" style="max-width:140px;"><select id="report-type"><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
              <div class="field" style="flex:2;"><input id="report-content" placeholder="What did you work on?" required></div>
            </div>
            <button class="btn btn-primary btn-sm" type="submit">Submit report</button>
          </form>
          <div id="mine-reports" class="loading-block"><div class="spinner"></div></div>
        </div>
      </div>
      <div class="card" style="margin-top:18px;">
        <h4 style="margin-bottom:12px;">Assignments</h4>
        <form id="assignment-form" style="margin-bottom:14px;">
          <div class="field-row">
            <div class="field" style="flex:2;"><input id="assignment-title" placeholder="Assignment title" required></div>
            <div class="field" style="flex:2;"><input id="assignment-link" placeholder="Link — Drive / GitHub / doc (optional)"></div>
          </div>
          <div class="field"><textarea id="assignment-desc" rows="2" placeholder="Notes about your submission (optional)"></textarea></div>
          <button class="btn btn-primary btn-sm" type="submit">Submit assignment</button>
        </form>
        <div id="mine-assignments" class="loading-block"><div class="spinner"></div></div>
      </div>
    </div>`;
  }
  async function wireMyProgram() {
    const grid = document.getElementById('mine-grid');
    if (!grid) return;
    const internNo = grid.dataset.internNo;
    try {
      const t = await THX.api(`/api/interns/${internNo}/tasks`);
      document.getElementById('mine-tasks').innerHTML = t.tasks.length ? `<div class="row-list">${t.tasks.map(taskRow).join('')}</div>` : `<p style="color:var(--slate);font-size:13px;">No tasks assigned yet.</p>`;
      document.querySelectorAll('[data-task-status]').forEach(sel => sel.addEventListener('change', async (e) => {
        try { await THX.api(`/api/interns/tasks/${e.target.dataset.taskStatus}`, { method: 'PATCH', body: { status: e.target.value } }); THX.toast('Task updated'); }
        catch (ex) { THX.toast(ex.message, true); }
      }));
    } catch (ex) { document.getElementById('mine-tasks').innerHTML = `<p style="color:var(--slate);font-size:13px;">${ex.message}</p>`; }

    async function loadReports() {
      const r = await THX.api(`/api/interns/${internNo}/reports`);
      document.getElementById('mine-reports').innerHTML = r.reports.length
        ? `<div class="row-list">${r.reports.slice().reverse().map(rp => `<div class="row-item"><div class="main"><h4 style="font-size:13.5px;">${rp.type === 'daily' ? 'Daily' : 'Weekly'} · ${THX.fmtDate(rp.date)}</h4><div class="meta">${THX.escapeHtml(rp.content)}</div></div></div>`).join('')}</div>`
        : `<p style="color:var(--slate);font-size:13px;">No reports submitted yet.</p>`;
    }
    loadReports().catch(ex => { document.getElementById('mine-reports').innerHTML = `<p style="color:var(--slate);font-size:13px;">${ex.message}</p>`; });

    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await THX.api(`/api/interns/${internNo}/reports`, { method: 'POST', body: { type: document.getElementById('report-type').value, content: document.getElementById('report-content').value } });
        document.getElementById('report-content').value = '';
        THX.toast('Report submitted');
        loadReports();
      } catch (ex) { THX.toast(ex.message, true); }
    });

    async function loadAssignments() {
      const a = await THX.api(`/api/interns/${internNo}/assignments`);
      document.getElementById('mine-assignments').innerHTML = a.assignments.length
        ? `<div class="row-list">${a.assignments.slice().reverse().map(assignmentRow).join('')}</div>`
        : `<p style="color:var(--slate);font-size:13px;">No assignments submitted yet.</p>`;
    }
    loadAssignments().catch(ex => { document.getElementById('mine-assignments').innerHTML = `<p style="color:var(--slate);font-size:13px;">${ex.message}</p>`; });

    document.getElementById('assignment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await THX.api(`/api/interns/${internNo}/assignments`, { method: 'POST', body: {
          title: document.getElementById('assignment-title').value,
          link: document.getElementById('assignment-link').value,
          description: document.getElementById('assignment-desc').value
        } });
        document.getElementById('assignment-title').value = '';
        document.getElementById('assignment-link').value = '';
        document.getElementById('assignment-desc').value = '';
        THX.toast('Assignment submitted');
        loadAssignments();
      } catch (ex) { THX.toast(ex.message, true); }
    });
  }
  function assignmentRow(a) {
    const graded = a.status === 'graded';
    return `<div class="row-item">
      <div class="main">
        <h4>${THX.escapeHtml(a.title)}${a.link ? ` · <a href="${THX.escapeHtml(a.link)}" target="_blank" rel="noopener">link</a>` : ''}</h4>
        <div class="meta">${THX.escapeHtml(a.description || '')}${a.description ? ' · ' : ''}submitted ${THX.fmtDate(a.submittedAt)}${graded && a.feedback ? ' · ' + THX.escapeHtml(a.feedback) : ''}</div>
      </div>
      <span class="tag ${graded ? 'tag-green' : ''}">${graded ? `${a.marks}/${a.maxMarks}` : 'Pending review'}</span>
    </div>`;
  }
  function taskRow(t) {
    return `<div class="row-item">
      <div class="main"><h4>${THX.escapeHtml(t.title)}</h4><div class="meta">${THX.escapeHtml(t.description || '')}${t.dueDate ? ' · due ' + THX.fmtDate(t.dueDate) : ''}</div></div>
      <select data-task-status="${t.id}" style="width:auto;padding:6px 10px;">
        <option value="pending" ${t.status === 'pending' ? 'selected' : ''}>Pending</option>
        <option value="in-progress" ${t.status === 'in-progress' ? 'selected' : ''}>In progress</option>
        <option value="done" ${t.status === 'done' ? 'selected' : ''}>Done</option>
      </select>
    </div>`;
  }

  /* ---------------- Leaderboard tab (everyone) ---------------- */
  async function leaderboardPanelHtml() {
    return `<div class="tab-panel" id="panel-leaderboard"><div class="table-wrap" id="lb-wrap"><div class="loading-block"><div class="spinner"></div></div></div></div>`;
  }
  async function wireLeaderboard() {
    const wrap = document.getElementById('lb-wrap');
    if (!wrap) return;
    try {
      const data = await THX.api('/api/interns/leaderboard', { auth: false });
      wrap.innerHTML = `<table><thead><tr><th>Rank</th><th>Intern</th><th>Department</th><th>Marks</th><th>Tasks done</th><th>Reports</th></tr></thead><tbody>
        ${data.leaderboard.map((r, i) => `<tr><td>#${i + 1}</td><td>${THX.escapeHtml(r.fullName)}</td><td>${THX.escapeHtml(r.department)}</td><td>${r.totalMarks}${r.assignmentsGraded ? ` <span class="hint">(${r.assignmentsGraded} graded)</span>` : ''}</td><td>${r.tasksDone}</td><td>${r.reportsSubmitted}</td></tr>`).join('')}
      </tbody></table>`;
    } catch (ex) { wrap.innerHTML = `<div class="empty-state">${ex.message}</div>`; }
  }

  /* ---------------- Manage tab (admin) ---------------- */
  async function managePanelHtml() {
    return `<div class="tab-panel" id="panel-manage">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
        <input id="manage-search" placeholder="Filter by name or intern no…" style="max-width:260px;">
      </div>
      <div class="table-wrap" id="manage-wrap"><div class="loading-block"><div class="spinner"></div></div></div>
    </div>`;
  }
  let allInterns = [], allMentors = [];
  async function wireManage() {
    const wrap = document.getElementById('manage-wrap');
    if (!wrap) return;
    try {
      const [list, users] = await Promise.all([
        THX.api('/api/interns/admin-list'),
        THX.api('/api/admin/users')
      ]);
      allInterns = list.interns;
      allMentors = users.users.filter(u => u.role === 'mentor');
      renderManageTable(allInterns);
    } catch (ex) { wrap.innerHTML = `<div class="empty-state">${ex.message}</div>`; }
    document.getElementById('manage-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderManageTable(allInterns.filter(i => i.fullName.toLowerCase().includes(q) || String(i.internNo).includes(q)));
    });
  }
  function renderManageTable(rows) {
    const wrap = document.getElementById('manage-wrap');
    wrap.innerHTML = `<table><thead><tr><th>No.</th><th>Name</th><th>Position</th><th>Mentor</th><th>Status</th><th>Actions</th></tr></thead><tbody>
      ${rows.map(i => `<tr>
        <td>${i.internNo}</td>
        <td>${THX.escapeHtml(i.fullName)}</td>
        <td>${THX.escapeHtml(i.position)}</td>
        <td><select data-assign="${i.internNo}" style="width:auto;padding:6px 8px;">
          <option value="">— none —</option>
          ${allMentors.map(m => `<option value="${m.id}" ${i.mentorId === m.id ? 'selected' : ''}>${THX.escapeHtml(m.name)}</option>`).join('')}
        </select></td>
        <td><span class="tag ${i.status === 'Active' ? 'tag-green' : 'tag-red'}">${i.status}</span></td>
        <td class="row-actions">
          ${i.status === 'Active' ? `<button class="btn btn-sm btn-danger" data-revoke="${i.internNo}">Revoke</button>` : `<button class="btn btn-sm btn-ghost" data-reinstate="${i.internNo}">Reinstate</button>`}
          <button class="btn btn-sm btn-ghost" data-addtask="${i.internNo}">+ Task</button>
          <button class="btn btn-sm btn-ghost" data-grades="${i.internNo}">Grade</button>
          <button class="btn btn-sm btn-ghost" data-resend="${i.internNo}">Resend</button>
          <button class="btn btn-sm btn-ghost" data-regenerate="${i.internNo}" title="Rebuild PDFs and refresh their storage links, without sending an email">Regenerate</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;

    wrap.querySelectorAll('[data-assign]').forEach(sel => sel.addEventListener('change', async (e) => {
      const internNo = e.target.dataset.assign;
      if (!e.target.value) { THX.toast('Pick a mentor to assign — this endpoint doesn\'t support clearing one yet.', true); return; }
      try {
        await THX.api(`/api/interns/${internNo}/assign-mentor`, { method: 'POST', body: { mentorId: e.target.value } });
        THX.toast('Mentor assigned');
      } catch (ex) { THX.toast(ex.message, true); }
    }));
    wrap.querySelectorAll('[data-revoke]').forEach(b => b.addEventListener('click', () => manageAction(b.dataset.revoke, 'revoke')));
    wrap.querySelectorAll('[data-reinstate]').forEach(b => b.addEventListener('click', () => manageAction(b.dataset.reinstate, 'reinstate')));
    wrap.querySelectorAll('[data-resend]').forEach(b => b.addEventListener('click', () => manageAction(b.dataset.resend, 'resend')));
    wrap.querySelectorAll('[data-regenerate]').forEach(b => b.addEventListener('click', () => manageAction(b.dataset.regenerate, 'regenerate')));
    wrap.querySelectorAll('[data-addtask]').forEach(b => b.addEventListener('click', () => openTaskModal(b.dataset.addtask)));
    wrap.querySelectorAll('[data-grades]').forEach(b => b.addEventListener('click', () => {
      assignmentsFilterInternNo = String(b.dataset.grades);
      const tab = document.querySelector('[data-tab="assignments"]');
      if (tab) tab.click();
      wireAssignments();
    }));
  }

  /* ---------------- Task modal (admin + mentor, shared) ---------------- */
  function openTaskModal(internNo) {
    document.getElementById('task-m-intern').value = internNo;
    document.getElementById('task-m-title').value = '';
    document.getElementById('task-m-desc').value = '';
    document.getElementById('task-m-due').value = '';
    document.getElementById('task-m-err').classList.remove('show');
    document.getElementById('task-modal-backdrop').classList.add('open');
  }
  function wireTaskModal() {
    const backdrop = document.getElementById('task-modal-backdrop');
    if (!backdrop) return;
    document.getElementById('task-m-cancel').addEventListener('click', () => backdrop.classList.remove('open'));
    document.getElementById('task-m-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('task-m-err'); err.classList.remove('show');
      const internNo = document.getElementById('task-m-intern').value;
      try {
        await THX.api(`/api/interns/${internNo}/tasks`, { method: 'POST', body: {
          title: document.getElementById('task-m-title').value.trim(),
          description: document.getElementById('task-m-desc').value.trim(),
          dueDate: document.getElementById('task-m-due').value || null
        }});
        backdrop.classList.remove('open');
        THX.toast('Task added');
      } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
    });
  }
  async function manageAction(internNo, action) {
    try {
      await THX.api(`/api/interns/${internNo}/${action}`, { method: 'POST' });
      THX.toast('Done — ' + action);
      const list = await THX.api('/api/interns/admin-list');
      allInterns = list.interns;
      renderManageTable(allInterns);
    } catch (ex) { THX.toast(ex.message, true); }
  }

  /* ---------------- My Interns tab (mentor) ---------------- */
  async function myInternsPanelHtml() {
    return `<div class="tab-panel" id="panel-assigned"><div id="assigned-wrap" class="loading-block"><div class="spinner"></div></div></div>`;
  }
  async function wireMyInterns() {
    const wrap = document.getElementById('assigned-wrap');
    if (!wrap) return;
    try {
      const data = await THX.api('/api/interns');
      wrap.innerHTML = data.interns.length ? `<div class="row-list">${data.interns.map(i => `
        <div class="row-item"><div class="main"><h4>${THX.escapeHtml(i.fullName)} · #${i.internNo}</h4><div class="meta">${THX.escapeHtml(i.position)} — ${THX.escapeHtml(i.department)}</div></div>
        <span class="tag ${i.status === 'Active' ? 'tag-green' : 'tag-red'}">${i.status}</span>
        <button class="btn btn-sm btn-ghost" data-addtask="${i.internNo}">+ Task</button></div>`).join('')}</div>`
        : `<div class="empty-state">No interns assigned to you yet.</div>`;
      wrap.querySelectorAll('[data-addtask]').forEach(b => b.addEventListener('click', () => openTaskModal(b.dataset.addtask)));
    } catch (ex) { wrap.innerHTML = `<div class="empty-state">${ex.message}</div>`; }
  }

  /* ---------------- Assignments tab (admin + mentor grading queue) ---------------- */
  async function assignmentsPanelHtml() {
    return `<div class="tab-panel" id="panel-assignments"><div class="table-wrap" id="assignments-wrap"><div class="loading-block"><div class="spinner"></div></div></div></div>`;
  }
  let assignmentsFilterInternNo = null;
  async function wireAssignments() {
    const wrap = document.getElementById('assignments-wrap');
    if (!wrap) return;
    try {
      let rows = (await THX.api('/api/interns/assignments')).assignments;
      if (user.role === 'mentor') {
        const mine = new Set((await THX.api('/api/interns')).interns.map(i => String(i.internNo)));
        rows = rows.filter(a => mine.has(String(a.internNo)));
      }
      if (assignmentsFilterInternNo) rows = rows.filter(a => String(a.internNo) === assignmentsFilterInternNo);
      renderAssignmentsTable(rows);
    } catch (ex) { wrap.innerHTML = `<div class="empty-state">${ex.message}</div>`; }
  }
  function renderAssignmentsTable(rows) {
    const wrap = document.getElementById('assignments-wrap');
    const filterBar = assignmentsFilterInternNo
      ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <span class="hint">Showing assignments for intern #${assignmentsFilterInternNo}</span>
          <button class="btn btn-ghost btn-sm" id="assignments-clear-filter">Show all</button>
        </div>` : '';
    if (!rows.length) { wrap.innerHTML = filterBar + `<div class="empty-state">No assignments submitted yet.</div>`; bindFilterClear(); return; }
    wrap.innerHTML = filterBar + `<table><thead><tr><th>Intern</th><th>Assignment</th><th>Submitted</th><th>Marks</th><th>Feedback</th><th></th></tr></thead><tbody>
      ${rows.slice().reverse().map(a => `<tr>
        <td>#${a.internNo}</td>
        <td>${THX.escapeHtml(a.title)}${a.link ? ` · <a href="${THX.escapeHtml(a.link)}" target="_blank" rel="noopener">link</a>` : ''}</td>
        <td>${THX.fmtDate(a.submittedAt)}</td>
        <td><input data-marks="${a.id}" type="number" min="0" max="${a.maxMarks}" value="${a.marks != null ? a.marks : ''}" style="width:64px;padding:6px 8px;"> / ${a.maxMarks}</td>
        <td><input data-feedback="${a.id}" value="${THX.escapeHtml(a.feedback || '')}" placeholder="Feedback (optional)" style="width:170px;padding:6px 8px;"></td>
        <td><button class="btn btn-sm btn-primary" data-grade="${a.id}">Save</button></td>
      </tr>`).join('')}
    </tbody></table>`;
    wrap.querySelectorAll('[data-grade]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.grade;
      const marks = wrap.querySelector(`[data-marks="${id}"]`).value;
      const feedback = wrap.querySelector(`[data-feedback="${id}"]`).value;
      if (marks === '') { THX.toast('Enter marks first', true); return; }
      try {
        await THX.api(`/api/interns/assignments/${id}/grade`, { method: 'PATCH', body: { marks, feedback } });
        THX.toast('Graded');
        wireAssignments();
      } catch (ex) { THX.toast(ex.message, true); }
    }));
    bindFilterClear();
  }
  function bindFilterClear() {
    const clearBtn = document.getElementById('assignments-clear-filter');
    if (clearBtn) clearBtn.addEventListener('click', () => { assignmentsFilterInternNo = null; wireAssignments(); });
  }

  /* ---------------- Groups tab (admin) ---------------- */
  async function groupsPanelHtml() {
    return `<div class="tab-panel" id="panel-groups">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
        <button class="btn btn-primary btn-sm" id="group-add-btn">+ Create group</button>
      </div>
      <div class="table-wrap" id="groups-wrap"><div class="loading-block"><div class="spinner"></div></div></div>
    </div>`;
  }
  let allGroups = [];
  async function wireGroups() {
    const wrap = document.getElementById('groups-wrap');
    if (!wrap) return;
    try {
      allGroups = (await THX.api('/api/interns/groups')).groups;
      renderGroupsTable(allGroups);
    } catch (ex) { wrap.innerHTML = `<div class="empty-state">${ex.message}</div>`; }
  }
  function wireGroupModal() {
    const backdrop = document.getElementById('group-modal-backdrop');
    if (!backdrop) return;
    const addBtn = document.getElementById('group-add-btn');
    if (addBtn) addBtn.addEventListener('click', () => openGroupModal(null));
    document.getElementById('group-m-cancel').addEventListener('click', () => backdrop.classList.remove('open'));
    document.getElementById('group-m-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('group-m-err'); err.classList.remove('show');
      const id = document.getElementById('group-m-id').value;
      const memberInternNos = Array.from(document.querySelectorAll('#group-m-members input:checked')).map(c => c.value);
      const body = {
        name: document.getElementById('group-m-name').value.trim(),
        description: document.getElementById('group-m-desc').value.trim(),
        memberInternNos
      };
      try {
        if (id) await THX.api(`/api/interns/groups/${id}`, { method: 'PATCH', body });
        else await THX.api('/api/interns/groups', { method: 'POST', body });
        backdrop.classList.remove('open');
        THX.toast(id ? 'Group updated' : 'Group created');
        wireGroups();
      } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
    });
  }
  function renderGroupsTable(rows) {
    const wrap = document.getElementById('groups-wrap');
    if (!rows.length) { wrap.innerHTML = `<div class="empty-state">No groups yet — create one to organize interns.</div>`; return; }
    wrap.innerHTML = `<table><thead><tr><th>Name</th><th>Description</th><th>Members</th><th></th></tr></thead><tbody>
      ${rows.map(g => `<tr>
        <td>${THX.escapeHtml(g.name)}</td>
        <td>${THX.escapeHtml(g.description || '—')}</td>
        <td>${g.memberInternNos.length}</td>
        <td class="row-actions">
          <button class="btn btn-sm btn-ghost" data-edit-group="${g.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-del-group="${g.id}">Delete</button>
        </td>
      </tr>`).join('')}
    </tbody></table>`;
    wrap.querySelectorAll('[data-edit-group]').forEach(b => b.addEventListener('click', () => openGroupModal(allGroups.find(g => g.id === b.dataset.editGroup))));
    wrap.querySelectorAll('[data-del-group]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm('Delete this group?')) return;
      try { await THX.api(`/api/interns/groups/${b.dataset.delGroup}`, { method: 'DELETE' }); THX.toast('Deleted'); wireGroups(); }
      catch (ex) { THX.toast(ex.message, true); }
    }));
  }
  async function openGroupModal(group) {
    document.getElementById('group-m-heading').textContent = group ? 'Edit group' : 'Create group';
    document.getElementById('group-m-id').value = group ? group.id : '';
    document.getElementById('group-m-name').value = group ? group.name : '';
    document.getElementById('group-m-desc').value = group ? (group.description || '') : '';
    document.getElementById('group-m-err').classList.remove('show');
    let interns = allInterns;
    if (!interns.length) {
      try { interns = (await THX.api('/api/interns/admin-list')).interns; allInterns = interns; } catch { interns = []; }
    }
    document.getElementById('group-m-members').innerHTML = interns.length
      ? interns.map(i => `<label style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;">
          <input type="checkbox" value="${i.internNo}" ${group && group.memberInternNos.includes(String(i.internNo)) ? 'checked' : ''}> ${THX.escapeHtml(i.fullName)} · #${i.internNo}
        </label>`).join('')
      : '<p class="hint">No interns yet.</p>';
    document.getElementById('group-modal-backdrop').classList.add('open');
  }

  /* ---------------- Assemble by role ---------------- */
  (async function init() {
    let tabsHtml = '', panels = [];
    if (user.role === 'admin') {
      tabsHtml += `<div class="tab active" data-tab="manage">Manage interns</div>`;
      panels.push(managePanelHtml());
      tabsHtml += `<div class="tab" data-tab="assignments">Assignments</div>`;
      panels.push(assignmentsPanelHtml());
      tabsHtml += `<div class="tab" data-tab="groups">Groups</div>`;
      panels.push(groupsPanelHtml());
      tabsHtml += `<div class="tab" data-tab="leaderboard">Leaderboard</div>`;
      panels.push(leaderboardPanelHtml());
    } else if (user.role === 'mentor') {
      tabsHtml += `<div class="tab active" data-tab="assigned">My interns</div>`;
      panels.push(myInternsPanelHtml());
      tabsHtml += `<div class="tab" data-tab="assignments">Assignments</div>`;
      panels.push(assignmentsPanelHtml());
      tabsHtml += `<div class="tab" data-tab="leaderboard">Leaderboard</div>`;
      panels.push(leaderboardPanelHtml());
    } else {
      tabsHtml += `<div class="tab active" data-tab="mine">My program</div>`;
      panels.push(myProgramPanelHtml());
      tabsHtml += `<div class="tab" data-tab="apply">Apply</div>`;
      panels.push(Promise.resolve(applyPanelHtml()));
      tabsHtml += `<div class="tab" data-tab="leaderboard">Leaderboard</div>`;
      panels.push(leaderboardPanelHtml());
    }
    const resolved = await Promise.all(panels);
    resolved[0] = resolved[0].replace('tab-panel"', 'tab-panel active"');
    shell(tabsHtml, resolved.join(''));
    wireTaskModal(); wireGroupModal();
    wireApply(); wireMyProgram(); wireLeaderboard(); wireManage(); wireMyInterns(); wireAssignments(); wireGroups();
  })();
}
</script>
</body>
</html>
