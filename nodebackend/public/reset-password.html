<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="Thinkorix" style="width:30px;height:30px;border-radius:8px;">Thinkorix</a>
    <p class="sub" id="sub">Choose a new password</p>

    <div class="alert alert-error" id="alert-err"></div>
    <div class="alert alert-success" id="alert-ok"></div>

    <form id="reset-form">
      <div class="field">
        <label for="rp-password">New password</label>
        <input type="password" id="rp-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="rp-password-2">Confirm password</label>
        <input type="password" id="rp-password-2" required minlength="6" autocomplete="new-password" placeholder="Repeat the password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="rp-submit">Set new password</button>
    </form>
    <p style="text-align:center;margin-top:16px;"><a href="login.html" style="font-size:12.5px;color:var(--slate);">Back to log in</a></p>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const email = params.get('email');
  const token = params.get('token');
  const form = document.getElementById('reset-form');
  const err = document.getElementById('alert-err');
  const ok = document.getElementById('alert-ok');

  if (!email || !token) {
    document.getElementById('sub').textContent = 'This reset link is missing information.';
    form.style.display = 'none';
    err.textContent = "This link looks incomplete — request a new one from the forgot-password page.";
    err.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show'); ok.classList.remove('show');
    const p1 = document.getElementById('rp-password').value;
    const p2 = document.getElementById('rp-password-2').value;
    if (p1 !== p2) { err.textContent = "Passwords don't match."; err.classList.add('show'); return; }
    const btn = document.getElementById('rp-submit');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      await THX.api('/api/auth/reset-password', { method: 'POST', body: { email, token, newPassword: p1 }, auth: false });
      ok.textContent = 'Password updated — redirecting to log in…';
      ok.classList.add('show');
      form.style.display = 'none';
      setTimeout(() => location.href = 'login.html', 1600);
    } catch (ex) {
      err.textContent = ex.message; err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Set new password';
    }
  });
</script>
</body>
</html>
