<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="Thinkorix" style="width:30px;height:30px;border-radius:8px;">Thinkorix</a>
    <p class="sub" id="auth-sub">One account for every portal.</p>

    <div class="auth-tabs">
      <div class="auth-tab active" data-mode="login">Log in</div>
      <div class="auth-tab" data-mode="register">Create account</div>
    </div>

    <div class="alert alert-error" id="alert-box"></div>

    <!-- LOGIN -->
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <div style="text-align:right;margin:-10px 0 16px;">
        <a href="forgot-password.html" style="font-size:12.5px;color:var(--slate);">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
    </form>

    <!-- REGISTER -->
    <form id="register-form" style="display:none;">
      <div class="field">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" required autocomplete="name" placeholder="Jane Doe">
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>I'm signing up as</label>
        <div class="role-grid" id="role-grid">
          <div class="role-opt active" data-role="intern">Intern / Student</div>
          <div class="role-opt" data-role="client">Client</div>
          <div class="role-opt" data-role="contributor">Contributor</div>
          <div class="role-opt" data-role="mentor">Mentor</div>
        </div>
        <p class="hint">This decides which portals you see. An admin can change it later.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create account</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || 'index.html';

  // If already logged in, just bounce along.
  if (THX.isLoggedIn()) location.href = redirectTo;

  const tabs = document.querySelectorAll('.auth-tab');
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const sub = document.getElementById('auth-sub');
  const alertBox = document.getElementById('alert-box');

  function setMode(mode) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    loginForm.style.display = mode === 'login' ? 'block' : 'none';
    registerForm.style.display = mode === 'register' ? 'block' : 'none';
    sub.textContent = mode === 'login' ? 'Welcome back — log in to continue.' : 'One account unlocks every portal you have access to.';
    alertBox.classList.remove('show');
  }
  tabs.forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

  let selectedRole = 'intern';
  function selectRole(role) {
    selectedRole = role;
    document.querySelectorAll('.role-opt').forEach(o => o.classList.toggle('active', o.dataset.role === role));
  }
  document.getElementById('role-grid').addEventListener('click', (e) => {
    const opt = e.target.closest('.role-opt');
    if (!opt) return;
    selectRole(opt.dataset.role);
  });

  // Anyone landing here on their way to the Client Portal just needs an
  // account — send them straight to "Create account" with Client
  // pre-selected instead of making them find the right tab and role card.
  if (redirectTo.includes('portal-client.html')) {
    selectRole('client');
    setMode('register');
    sub.textContent = 'Create a free account to submit your project — no approval needed.';
  } else if (params.get('mode') === 'register') {
    setMode('register');
  }

  function showError(msg) {
    alertBox.textContent = msg;
    alertBox.classList.add('show');
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.remove('show');
    const btn = document.getElementById('login-submit');
    btn.disabled = true; btn.textContent = 'Logging in…';
    try {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const data = await THX.api('/api/auth/login', { method: 'POST', body: { email, password }, auth: false });
      THX.setSession(data.user, data.token);
      location.href = redirectTo;
    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = 'Log in';
    }
  });

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.classList.remove('show');
    const btn = document.getElementById('register-submit');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const data = await THX.api('/api/auth/register', { method: 'POST', body: { name, email, password, role: selectedRole }, auth: false });
      THX.setSession(data.user, data.token);
      location.href = redirectTo;
    } catch (err) {
      showError(err.message);
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
