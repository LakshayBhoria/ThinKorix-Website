<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="brand"><img src="logo.jpeg" alt="Thinkorix" style="width:30px;height:30px;border-radius:8px;">Thinkorix</a>
    <p class="sub">Reset your password</p>

    <a href="login.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
      Back to log in
    </a>

    <div class="alert alert-error" id="alert-err"></div>
    <div class="alert alert-success" id="alert-ok"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="fp-email">Email</label>
        <input type="email" id="fp-email" required autocomplete="email" placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="fp-submit">Send reset link</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const err = document.getElementById('alert-err');
  const ok = document.getElementById('alert-ok');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show'); ok.classList.remove('show');
    const btn = document.getElementById('fp-submit');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const email = document.getElementById('fp-email').value.trim();
      const data = await THX.api('/api/auth/forgot-password', { method: 'POST', body: { email }, auth: false });
      if (data.devResetUrl) {
        // Email sending is off in this local setup, so the link is handed
        // back directly instead of just disappearing into an inbox.
        ok.innerHTML = `Email sending isn't configured locally, so here's your reset link directly:<br><a href="${data.devResetUrl}" style="color:var(--green);word-break:break-all;">${data.devResetUrl}</a>`;
      } else {
        ok.innerHTML = `${THX.escapeHtml(data.message)}<br><br><b>Don't see it?</b> Check your spam or junk folder — password reset emails sometimes land there.`;
      }
      ok.classList.add('show');
      form.reset();
    } catch (ex) {
      err.textContent = ex.message; err.classList.add('show');
    } finally {
      btn.disabled = false; btn.textContent = 'Send reset link';
    }
  });
</script>
</body>
</html>
