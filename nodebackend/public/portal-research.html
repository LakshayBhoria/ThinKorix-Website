<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Research & Innovation Cell — Thinkorix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="appbar" class="appbar"></div>

<main>
<div class="page wrap">
  <div class="page-head">
    <div>
      <div class="eyebrow">Research</div>
      <h1>Research & Innovation Cell</h1>
      <p>Papers, white papers, patents, and open-source work from our AI and hardware research groups.</p>
    </div>
    <button class="btn btn-primary" id="add-btn" style="display:none;">+ Add entry</button>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
    <select id="f-group" style="width:auto;"><option value="">All groups</option><option>AI</option><option>Hardware</option><option>Software</option></select>
    <select id="f-type" style="width:auto;"><option value="">All types</option><option value="paper">Paper</option><option value="whitepaper">Whitepaper</option><option value="patent">Patent</option><option value="opensource">Open source</option></select>
  </div>

  <div id="list" class="grid grid-3"><div class="loading-block"><div class="spinner"></div> Loading…</div></div>
</div>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h3>Add research entry</h3>
    <div class="alert alert-error" id="m-err"></div>
    <form id="m-form">
      <div class="field"><label>Title</label><input id="m-title" required></div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="m-type"><option value="paper">Paper</option><option value="whitepaper">Whitepaper</option><option value="patent">Patent</option><option value="opensource">Open source</option></select></div>
        <div class="field"><label>Group</label><select id="m-group"><option>AI</option><option>Hardware</option><option>Software</option></select></div>
      </div>
      <div class="field"><label>Authors</label><input id="m-authors" placeholder="Comma separated"></div>
      <div class="field"><label>Link (optional)</label><input id="m-link" type="url" placeholder="https://…"></div>
      <div class="field"><label>Description</label><textarea id="m-desc"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="m-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Publish</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script>
if (THX.requireLogin()) {
  THX.renderAppbar({ title: 'Research & Innovation Cell' });
  const user = THX.getUser();
  const isAdmin = user.role === 'admin';
  const list = document.getElementById('list');
  const TYPE_LABEL = { paper: 'Paper', whitepaper: 'Whitepaper', patent: 'Patent', opensource: 'Open source' };

  async function load() {
    list.innerHTML = `<div class="loading-block"><div class="spinner"></div> Loading…</div>`;
    try {
      const data = await THX.api('/api/research', { query: { group: document.getElementById('f-group').value, type: document.getElementById('f-type').value } });
      if (!data.items.length) { list.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Nothing published yet${isAdmin ? ' — add the first entry.' : '.'}</div>`; return; }
      list.innerHTML = data.items.map(i => `
        <div class="card">
          <span class="tag tag-green">${TYPE_LABEL[i.type] || i.type}</span> <span class="tag tag-slate">${THX.escapeHtml(i.group)}</span>
          <h3 style="font-size:16px;margin:12px 0 6px;">${THX.escapeHtml(i.title)}</h3>
          <p style="font-size:13px;color:var(--slate);margin-bottom:10px;">${THX.escapeHtml(i.description || '')}</p>
          ${i.authors ? `<div class="hint" style="margin-bottom:8px;">${THX.escapeHtml(i.authors)}</div>` : ''}
          <div style="display:flex;justify-content:space-between;align-items:center;">
            ${i.link ? `<a href="${i.link}" target="_blank" class="btn btn-ghost btn-sm">Open</a>` : '<span></span>'}
            ${isAdmin ? `<button class="btn btn-sm btn-danger" data-del="${i.id}">Delete</button>` : ''}
          </div>
        </div>`).join('');
      if (isAdmin) list.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this entry?')) return;
        try { await THX.api('/api/research/' + b.dataset.del, { method: 'DELETE' }); THX.toast('Deleted'); load(); }
        catch (ex) { THX.toast(ex.message, true); }
      }));
    } catch (ex) { list.innerHTML = `<div class="alert alert-error show" style="grid-column:1/-1;">${ex.message}</div>`; }
  }
  document.getElementById('f-group').addEventListener('change', load);
  document.getElementById('f-type').addEventListener('change', load);
  load();

  if (isAdmin) {
    const backdrop = document.getElementById('modal-backdrop');
    document.getElementById('add-btn').style.display = 'inline-flex';
    document.getElementById('add-btn').addEventListener('click', () => backdrop.classList.add('open'));
    document.getElementById('m-cancel').addEventListener('click', () => backdrop.classList.remove('open'));
    document.getElementById('m-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('m-err'); err.classList.remove('show');
      try {
        await THX.api('/api/research', { method: 'POST', body: {
          title: document.getElementById('m-title').value.trim(),
          type: document.getElementById('m-type').value,
          group: document.getElementById('m-group').value,
          authors: document.getElementById('m-authors').value.trim(),
          link: document.getElementById('m-link').value.trim(),
          description: document.getElementById('m-desc').value.trim()
        }});
        backdrop.classList.remove('open');
        document.getElementById('m-form').reset();
        THX.toast('Published');
        load();
      } catch (ex) { err.textContent = ex.message; err.classList.add('show'); }
    });
  }
}
</script>
</body>
</html>
